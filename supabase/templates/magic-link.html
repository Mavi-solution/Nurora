<!--
  Nurora sign-in email.

  The {{ .Token }} placeholder is the part that matters: Supabase's stock
  template ships a magic link only, and Nurora's sign-in screen asks for a
  6-digit code. Without this template that screen can never be satisfied.
  The link is kept as a fallback for people who would rather just click.
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a201f;max-width:520px;margin:0 auto;padding:32px 24px;">
  <div style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#6b7573;">Nurora</div>
  <h2 style="font-size:20px;margin:10px 0 18px;">Your sign-in code</h2>

  <p style="font-size:15px;line-height:1.6;color:#3d4644;margin:0 0 20px;">
    Enter this code to sign in. It expires shortly and can only be used once.
  </p>

  <p style="font-size:34px;font-weight:600;letter-spacing:.32em;background:#f4f0e9;border-radius:12px;padding:18px 20px;text-align:center;margin:0 0 22px;">
    {{ .Token }}
  </p>

  <p style="font-size:13px;color:#6b7573;line-height:1.6;margin:0;">
    Prefer a link? <a href="{{ .ConfirmationURL }}" style="color:#2f6f6b;">Sign in here</a>.
    If you didn't request this, you can ignore this email.
  </p>
</div>
